aid: bandana
name: Bandana
description: 'Bandana (operated by Workwise Solutions Inc.) is a two-sided marketplace and job-search
  platform for hourly and entry-level workers. Job seekers get free tools to find better-paying local
  jobs with benefits, generate resumes, auto-match to openings via Bandana Apply, and track applications;
  employers post jobs for free, reach local talent, promote listings across social platforms, and use a
  built-in ATS or integrate their existing hiring flow. Backed by Craft Ventures and General Catalyst,
  Bandana operates across California, New York, New Jersey, Connecticut, Chicago, and Washington, D.C.
  As of this profile Bandana publishes no public developer/API surface — no docs portal, OpenAPI, GitHub
  organization, or /.well-known discovery documents were found; this record captures its public identity
  and product links.'
